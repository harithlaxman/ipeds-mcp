[project]
name = "ipeds-mcp"
version = "0.1.0"
description = "MCP server and ingest pipeline for exploring 20 years of IPEDS data in Postgres"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.3",
    "mcp>=1.9.0",
    "openai>=2.50.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
]
